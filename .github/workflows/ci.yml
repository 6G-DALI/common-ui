name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No registry credentials needed: @6g-dali/ui-theme resolves to the
      # workspace copy, and everything else is public on npmjs.
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
