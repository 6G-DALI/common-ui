name: publish

# Publishes both packages to npmjs.com on a version tag.
#
# npmjs rather than GitHub Packages: the npm registry on GitHub Packages
# authenticates every read with no anonymous tier, even for public packages, so
# every consumer — each Dockerfile, each developer machine, each CI job — would
# need a live token forever. npmjs serves public packages anonymously, so
# `npm ci` works unauthenticated everywhere and only this workflow holds a
# credential.
#
# The two are released in lockstep — @6g-dali/ui-shell depends on an exact
# @6g-dali/ui-theme version — so one tag covers both. Bump with:
#
#   npm run version:set -- 0.2.0     # both package.json files AND the pin
#   npm install --package-lock-only
#   git commit -am "v0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# Requires an NPM_TOKEN repository secret: a **Granular Access Token** with
# read/write on the @6g-dali scope. (npm has retired the old classic
# Automation/Publish tokens; granular ones are the only kind the UI now issues,
# and they expire, so this secret needs rotating.)
#
# If a publish fails with `npm error code EOTP` — after provenance has already
# been signed, which makes it look like a signing problem — the token is not at
# fault: the npm account's two-factor mode is set to "authorization and writes",
# which demands a one-time password on every publish and cannot be satisfied
# from CI. Switch the account (and check the org) to "authorization only".
#
# To retry a release whose publish failed, re-run this workflow with
# workflow_dispatch selecting the *tag* as the ref. Nothing is consumed by a
# failed publish, so the same version can be published again.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by `npm publish --provenance`, which signs the package with a
      # GitHub OIDC token so npmjs can show a verified link back to this
      # workflow run and commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Writes the .npmrc that points npm at the public registry and picks
          # up NODE_AUTH_TOKEN.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # Tag pushes only: on a workflow_dispatch from a branch GITHUB_REF_NAME is
      # the branch name, so this would compare "main" against "0.1.3" and fail
      # for the wrong reason. Dispatching from a tag ref still gets the check.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/ui-theme packages/ui-shell; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::$pkg is at $version but the tag says $tag"
              exit 1
            fi
          done

      - run: npm run type-check
      - run: npm run build

      # --access public comes from each package's publishConfig; scoped packages
      # are otherwise published restricted and fail on a free account.
      - name: Publish @6g-dali/ui-theme
        run: npm publish -w @6g-dali/ui-theme --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Second, so the ui-theme version it pins already exists in the registry.
      - name: Publish @6g-dali/ui-shell
        run: npm publish -w @6g-dali/ui-shell --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
